name: Actualizar datos CLRM03

on:
  schedule:
    - cron: '*/5 * * * *'   # cada 5 minutos (~8,640 runs/mes, dentro del límite gratuito)
  workflow_dispatch:          # permite correrlo manualmente desde GitHub
  push:
    paths:
      - 'data/wms_totes_completo.json'    # Tampermonkey totes → regenera al instante
      - 'data/wms_address_CLRM03.json'    # Tampermonkey address → regenera ocupacion

permissions:
  contents: write
  issues: write

concurrency:
  group: update-data-clrm03
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 4        # si supera 4 min, algo falló → no bloquea el siguiente ciclo

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install google-cloud-bigquery db-dtypes pyarrow zoneinfo 2>/dev/null || pip install google-cloud-bigquery db-dtypes pyarrow

      - name: Autenticar BigQuery (Service Account)
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > /tmp/sa_key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa_key.json" >> $GITHUB_ENV

      - name: Verificar credenciales BigQuery
        run: |
          python - <<'EOF'
          import json, sys
          from google.cloud import bigquery
          try:
              kind = json.load(open('/tmp/sa_key.json')).get('type')
          except Exception as e:
              sys.exit(f"::error::GCP_SERVICE_ACCOUNT_KEY no es un JSON valido: {e}")
          if kind != 'service_account':
              print(f"::warning::El secret es de tipo '{kind}', no 'service_account'. Credenciales de usuario pueden ser restringidas o vencer.")
          try:
              bigquery.Client(project='meli-bi-data').query('SELECT 1').result()
          except Exception as e:
              sys.exit(f"::error::Autenticacion BigQuery fallo ({type(e).__name__}): {str(e)[:300]}")
          print("Credenciales BigQuery OK")
          EOF

      - name: Generar checkin/putaway inbound JSON
        run: python generar_checkin_json.py --dias 3

      - name: Generar putaway JSON
        run: python generar_putaway_json.py

      - name: Generar ocupacion JSON (layout BQ)
        run: python fetch_ocupacion.py

      - name: Merge stock WMS sobre layout BQ
        run: |
          if [ -f data/wms_address_CLRM03.json ]; then
            python procesar_wms_address.py
          else
            echo "Sin wms_address_CLRM03.json — usando solo datos BQ"
          fi

      - name: Generar MZ heatmap JSON
        run: python generar_mz_json.py

      - name: Commit y push datos actualizados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: auto $(date -u +'%Y-%m-%d %H:%M' )"
          git pull --rebase -X theirs origin main
          git push

      - name: Cerrar alerta si todo volvio a funcionar
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label data-stale --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "Actualizacion restablecida (run ${{ github.run_id }})."
          done

      - name: Alertar si falla la actualizacion
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create data-stale --color B60205 --description "Datos del dashboard sin actualizar" 2>/dev/null || true
          if [ -z "$(gh issue list --label data-stale --state open --json number -q '.[0].number')" ]; then
            gh issue create --label data-stale \
              --title "Dashboard CLRM03: actualizacion automatica fallando" \
              --body "El workflow fallo: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Causa mas probable: credenciales GCP (secret GCP_SERVICE_ACCOUNT_KEY). Los datos del dashboard no se estan actualizando."
          fi
